<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatos Aleatório</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: aliceblue;
            margin-top: 50px;
        }
        h1 {
            color: rgb(1, 13, 172);
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: rgb(1, 13, 172);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 20px;
        }
        button:hover {
            background-color: #f7ac3c;
        }
        #imagem {
            max-width: 500px;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <h1>😺 Galeria de Gatos</h1>
    <p>Clique no botão para ver um gato aleatório!</p>
    <button id="botao">Mostrar Gato</button>
    <br>
    <img id="imagem" src="" width="400" style="display: none;">
    <script src="script.js"></script>
</body>
<footer>
        <p>SENAI Brasília-DF &copy;2026</p>
    </footer>
</html>
