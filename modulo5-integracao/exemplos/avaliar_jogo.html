<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Games - Avaliar Jogo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #16213e;
            padding: 40px;
            border-radius: 12px;
            width: 420px;
            box-shadow: 0 4px 20px black;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #e94560;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #aaaaaa;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid black;
            border-radius: 6px;
            background-color: #0f3460;
            color: #ffffff;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #e94560;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: red;
        }
        .erro {
            color: #ff6b81;
            font-size: 13px;
            margin-top: -14px;
            margin-bottom: 16px;
        }
        .sucesso {
            color: #2ecc71;
            font-weight: bold;
            text-align: center;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Avaliar Jogo</h1>

        <form id="form-avaliacao">
            <label for="comentario">Comentário</label>
            <input type="text" id="comentario" placeholder="O que você achou do jogo?">
            <p class="erro" id="erro-comentario"></p>

            <label for="nota">Nota (1 a 5)</label>
            <input type="number" id="nota" placeholder="Ex: 5">
            <p class="erro" id="erro-nota"></p>

            <button type="submit">Enviar Avaliação</button>
        </form>

        <p class="sucesso" id="mensagem-sucesso"></p>
    </div>

    <script>
        const form = document.getElementById("form-avaliacao");

        form.addEventListener("submit", function (event) {
            // Não deixa a página recarregar
            event.preventDefault();

            // Limpar mensagens anteriores
            document.getElementById("erro-comentario").textContent = "";
            document.getElementById("erro-nota").textContent = "";
            document.getElementById("mensagem-sucesso").textContent = "";

            // Ler valores
            const comentario = document.getElementById("comentario").value.trim();
            const nota = parseFloat(document.getElementById("nota").value);

            // Validar
            let valido = true;

            if (comentario === "") {
                document.getElementById("erro-comentario").textContent =
                    "O comentário é obrigatório.";
                valido = false;
            }

            if (isNaN(nota) || nota < 1 || nota > 5) {
                document.getElementById("erro-nota").textContent =
                    "A nota deve ser um número entre 1 e 5.";
                valido = false;
            }

            // Se passou em tudo
            if (valido) {
                console.log("Avaliação válida:", { comentario, nota });
                document.getElementById("mensagem-sucesso").textContent =
                    "Avaliação enviada com sucesso!";
            }
        });
    </script>
</body>
</html>
