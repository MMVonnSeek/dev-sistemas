<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Games - Plataformas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="topo">
        <span class="logo">Loja de Games</span>
        <nav>
            <a href="index.html">Catálogo</a>
            <a href="cadastrar_jogo.html">Novo jogo</a>
            <a href="plataformas.html" class="ativo">Plataformas</a>
        </nav>
    </header>

    <main class="pagina">
        <h1>Plataformas</h1>
        <br>

        <!-- O JavaScript escreve aqui: carregando, erro, sucesso... -->
        <p id="mensagem" class="mensagem"></p>

        <div class="duas-colunas">

            <!-- Coluna 1: lista (Aula 33 — GET) -->
            <section class="cartao">
                <h2>
                    Cadastradas
                    <span class="contador">(<span id="total-plataformas">0</span>)</span>
                </h2>
                <!-- O JavaScript cria um <li> aqui para cada plataforma -->
                <ul id="lista-plataformas" class="lista"></ul>
            </section>

            <!-- Coluna 2: formulário (Aula 34 — POST). Ainda sem JavaScript nesta aula -->
            <section class="cartao">
                <h2>Nova plataforma</h2>
                <form id="form-plataforma">
                    <label for="nome">Nome da plataforma</label>
                    <input type="text" id="nome" placeholder="Ex: Nintendo Switch">
                    <button type="submit" class="btn btn-bloco">Cadastrar</button>
                </form>
            </section>

        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/plataformas.js"></script>
</body>
</html>
